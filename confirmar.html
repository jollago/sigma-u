<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Confirma tu correo electrónico para activar tu cuenta de SIGMA-U">
<title>Confirmar correo | SIGMA-U</title>
<link rel="icon" href="assets/img/sigma-mark.svg">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
<header class="topbar"><div class="container topbar-inner"><a class="brand" href="index.html"><img src="assets/img/sigma-mark.svg" width="34" height="34" alt=""><span>SIGMA-U</span></a></div></header>
<main class="auth-wrap">
<section class="auth-card">
<div class="auth-mark">σ</div>
<p class="eyebrow">VERIFICACIÓN DE CORREO</p>
<h1 id="confirmationTitle">Activa tu cuenta</h1>
<p class="muted" id="confirmationText">Estamos comprobando el enlace de confirmación de tu correo.</p>
<p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
<button class="primary" id="confirmEmailButton" type="button" hidden>Confirmar correo</button>
<a class="soft-btn" id="goLogin" href="login.html" hidden style="margin-top:12px;justify-content:center">Ir a iniciar sesión</a>
<form id="resendForm" class="auth-form" hidden>
  <label for="resendEmail">Correo electrónico usado en el registro</label>
  <input id="resendEmail" name="email" type="email" autocomplete="email" placeholder="nombre@correo.com" required>
  <button class="primary" id="resendButton" type="submit">Enviar nuevo enlace</button>
</form>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
(() => {
 const client=window.sigmaSupabase;
 const params=new URLSearchParams(location.search);
 const tokenHash=params.get("token_hash");
 const type=params.get("type")||"email";
 const button=document.getElementById("confirmEmailButton");
 const message=document.getElementById("authMessage");
 const login=document.getElementById("goLogin");
 const resendForm=document.getElementById("resendForm");
 const title=document.getElementById("confirmationTitle");
 const description=document.getElementById("confirmationText");
 const say=(text,ok=false)=>{message.textContent=text;message.className="auth-message "+(ok?"success":"error");};
 const showSuccess=()=>{
   title.textContent="¡Correo confirmado!";
   description.textContent="Tu cuenta de SIGMA-U ya está activada. Ahora puedes iniciar sesión.";
   say("La verificación se completó correctamente.",true);
   button.hidden=true;resendForm.hidden=true;login.hidden=false;
 };
 const showExpired=(text)=>{
   title.textContent="El enlace no está disponible";
   description.textContent="El enlace pudo haber vencido o haber sido abierto previamente por el sistema de seguridad del correo.";
   say(text||"Solicita un nuevo enlace e intenta abrirlo una sola vez.",false);
   button.hidden=true;resendForm.hidden=false;login.hidden=true;
 };
 if(!client){say("No se pudo conectar con el servicio de autenticación. Intenta nuevamente más tarde.");return;}

 // Enlace personalizado con token_hash: la verificación se hace al pulsar el botón.
 if(tokenHash){
   description.textContent="Pulsa el botón para confirmar tu dirección de correo y activar tu cuenta.";
   button.hidden=false;
   button.addEventListener("click",async()=>{
     button.disabled=true;button.textContent="Verificando...";
     const {error}=await client.auth.verifyOtp({token_hash:tokenHash,type});
     if(error){button.disabled=false;button.textContent="Intentar nuevamente";showExpired("Supabase no aceptó el enlace. Puede haber vencido o ya haber sido utilizado.");return;}
     showSuccess();
   });
 } else {

 // Enlace predeterminado de Supabase: después de verificar, devuelve la sesión en el fragmento URL.
 (async()=>{
   const hashParams=new URLSearchParams(location.hash.slice(1));
   const errorCode=hashParams.get("error_code");
   const errorText=hashParams.get("error_description")||hashParams.get("error");
   if(errorCode||errorText){
     showExpired(errorCode==="otp_expired"?"El enlace de confirmación expiró o ya fue utilizado. Solicita uno nuevo aquí abajo.":"No fue posible validar el enlace. Solicita uno nuevo aquí abajo.");
     return;
   }
   const {data:{session}}=await client.auth.getSession();
   if(session){showSuccess();return;}
   showExpired("No encontramos una sesión de confirmación válida. Puedes solicitar un nuevo enlace aquí abajo.");
 })();
 }

 // Permite reenviar el correo de confirmación sin crear otra cuenta.
 resendForm.addEventListener("submit",async e=>{
   e.preventDefault();
   const email=document.getElementById("resendEmail").value.trim();
   const resendButton=document.getElementById("resendButton");
   resendButton.disabled=true;resendButton.textContent="Enviando...";
   const {error}=await client.auth.resend({
     type:"signup",
     email,
     options:{emailRedirectTo:"https://jollago.github.io/confirmar.html"}
   });
   resendButton.disabled=false;resendButton.textContent="Enviar nuevo enlace";
   if(error){say("No se pudo reenviar el correo. "+error.message);return;}
   say("Si el registro está pendiente, Supabase enviará un nuevo enlace. Revisa tu bandeja de entrada y spam.",true);
 });
})();
</script>
</body>
</html>
