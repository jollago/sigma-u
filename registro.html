<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Accede a la comunidad universitaria SIGMA-U"><title>Crear cuenta | SIGMA-U</title><link rel="icon" href="assets/img/sigma-mark.svg"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/auth.css"></head><body><header class="topbar"><div class="container topbar-inner"><a class="brand" href="index.html"><img src="assets/img/sigma-mark.svg" width="34" height="34" alt=""><span>SIGMA-U</span></a><div class="top-actions"><a class="soft-btn" href="index.html">Volver al inicio</a></div></div></header><main class="auth-wrap"><section class="auth-card auth-card-wide"><div class="auth-mark">σ</div><p class="eyebrow">ÚNETE A SIGMA-U</p><h1>Crea tu cuenta</h1><p class="muted">Conecta con otros estudiantes y comparte conocimiento.</p><form id="registerForm" class="auth-form"><div class="form-grid"><div class="field-full"><label for="fullName">Nombre completo</label><input id="fullName" name="fullName" autocomplete="name" placeholder="Tu nombre y apellido" required maxlength="80"></div><div><label for="program">Programa académico</label><input id="program" name="program" placeholder="Ej. Ingeniería de Sistemas" maxlength="100"></div><div><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" placeholder="nombre@correo.com" required></div><div><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="Mínimo 8 caracteres" required></div><div><label for="confirmPassword">Confirmar contraseña</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Repite tu contraseña" required></div></div><button class="primary" type="submit">Crear cuenta</button><p id="authMessage" class="auth-message" role="status"></p></form><div class="auth-links"><span>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></span></div><p class="auth-foot">Si la confirmación por correo está activa, revisa tu bandeja de entrada para verificar la cuenta.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/supabase-client.js"></script><script src="assets/js/auth.js"></script></body></html>
