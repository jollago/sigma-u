<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Perfil académico de SIGMA-U"><title>Mi perfil | SIGMA-U</title><link rel="icon" href="assets/img/sigma-mark.svg"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/auth.css"></head><body><header class="topbar"><div class="container topbar-inner"><a class="brand" href="index.html"><img src="assets/img/sigma-mark.svg" width="34" height="34" alt=""><span>SIGMA-U</span></a><div class="top-actions"><a class="soft-btn" href="comunidad.html">Volver a comunidad</a></div></div></header>
<main class="auth-wrap"><section class="auth-card auth-card-wide profile-card"><p class="eyebrow">TU IDENTIDAD EN SIGMA-U</p><h1>Mi perfil académico</h1><p class="muted">Completa tu información para que otros estudiantes puedan conocerte y encontrar personas con intereses similares.</p>
<form id="profileForm" class="auth-form">
<div class="profile-photo-row"><img id="avatarPreview" class="profile-preview hidden" alt="Vista previa de foto de perfil"><div><label for="avatarFile">Foto de perfil</label><input id="avatarFile" type="file" accept="image/*"><small class="field-help">Imagen JPG, PNG o WebP. Máximo 5 MB.</small></div></div>
<div class="form-grid"><div class="field-full"><label for="fullName">Nombre completo</label><input id="fullName" required maxlength="80" autocomplete="name"></div>
<div><label for="program">Programa académico</label><select id="program" data-academic-program required><option value="">Selecciona tu programa</option></select></div>
<div><label for="campus">Sede</label><select id="campus" data-campus><option value="">Selecciona tu sede</option></select></div>
<div><label for="semester">Semestre actual</label><select id="semester"><option value="">Selecciona semestre</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>Egresado/a</option></select></div>
<div><label for="email">Correo electrónico</label><input id="email" type="email" disabled></div>
<div class="field-full"><label for="bio">Sobre mí</label><textarea id="bio" rows="4" maxlength="500" placeholder="Cuéntale a la comunidad quién eres, qué estudias y qué te interesa…"></textarea></div>
<div class="field-full"><label for="interests">Intereses académicos</label><input id="interests" maxlength="250" placeholder="Ej. programación, investigación, emprendimiento, música…"><small class="field-help">Separa tus intereses con comas.</small></div></div>
<button class="primary" type="submit">Guardar cambios</button><p id="authMessage" class="auth-message" role="status"></p></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/supabase-client.js"></script><script src="assets/js/academic-data.js"></script><script src="assets/js/profile.js"></script></body></html>
